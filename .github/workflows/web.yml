# Veröffentlicht die Web-App auf GitHub Pages (Zweig gh-pages): https://<name>.github.io/AzuNavi/
# Läuft bei jedem Versions-Tag (v...) oder per Knopf: Actions -> "Web-App veröffentlichen" -> Run workflow.
# Einmalig nötig: Settings -> Pages -> Source "Deploy from a branch", Branch "gh-pages", Ordner "/ (root)".
name: Web-App veröffentlichen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build:web
        env:
          AZ_BASE: /${{ github.event.repository.name }}/

      - name: Auf GitHub Pages veröffentlichen
        run: |
          cd dist-web
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "AzuNavi Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web-App ${{ github.ref_name }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Web-App: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
