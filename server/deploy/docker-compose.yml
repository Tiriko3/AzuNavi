# ENTWURF – nur zum Testen mit erfundenen Daten.
# Aufruf im Ordner server/:  docker compose -f deploy/docker-compose.yml up -d --build
# Vorher in deploy/.env setzen:  BIND_IP=<Adresse der VM im Netz>
services:
  azunavi:
    build: { context: .. }
    image: azunavi-server:0.1.0
    command: ["serve", "--bind", "0.0.0.0:8080"]
    environment:
      AZUNAVI_TRUST_PROXY: "true"      # nur ok, weil der Container ausschließlich über Caddy erreichbar ist
      RUST_LOG: info
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    volumes: ["azdata:/data"]
    networks: [intern]                 # kein Zugang nach außen, kein veröffentlichter Port
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on: [azunavi]
    ports: ["${BIND_IP:?BIND_IP in deploy/.env setzen}:443:443"]   # nur an die VM-Adresse binden, nicht an alle
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [intern, aussen]
    restart: unless-stopped

networks:
  intern: { internal: true }
  aussen: {}
volumes:
  azdata:
  caddy_data:
  caddy_config:
