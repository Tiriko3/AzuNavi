#!/usr/sbin/nft -f
# ENTWURF – nur zum Testen. Vor dem Laden anpassen (Schnittstelle, Adressen) und mit "nft -c -f" prüfen.
# WICHTIG: Docker veröffentlicht Ports per DNAT. Dieser Verkehr läuft durch die FORWARD-Kette, NICHT durch INPUT.
# Deshalb wird Port 443 unten in "forward" begrenzt. Eine Regel nur in "input" würde den Container-Port nicht schützen.
flush ruleset

define NIC       = "eth0"              # Netzwerkkarte der VM
define LAN       = 192.168.50.0/24     # Adressen, die den Server erreichen dürfen
define ADMIN_IP  = 192.168.50.10       # Admin-PC (SSH)
define DNS_NTP   = { 192.168.50.1 }    # Resolver und Zeitserver

table inet azunavi {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		ip saddr $ADMIN_IP tcp dport 22 ct state new limit rate 6/minute accept
		icmp type echo-request limit rate 5/second accept
		counter drop
	}
	# Weitergeleiteter Verkehr (Docker-Ports): von außen nur LAN -> Port 443, alles andere verboten.
	# Priorität -10: läuft VOR den Regeln von Docker.
	chain forward {
		type filter hook forward priority -10; policy accept;
		ct state established,related accept
		iifname $NIC ip saddr != $LAN counter drop
		iifname $NIC ct original proto-dst != 443 counter drop
		iifname $NIC ip saddr $LAN ct original proto-dst 443 ct state new limit rate over 60/second counter drop
	}
	chain output {
		type filter hook output priority filter; policy drop;
		oif "lo" accept
		ct state established,related accept
		ip daddr $DNS_NTP udp dport { 53, 123 } accept
		ip daddr $DNS_NTP tcp dport 53 accept
		tcp dport { 80, 443 } accept comment "nur für Updates; später auf Spiegelserver einschränken"
		counter drop
	}
}
